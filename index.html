<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Wait...</title>
    <style>
        /* Reset defaults and center content */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Container styling */
        .waiting-container {
            text-align: center;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 90%;
        }

        /* CSS Animated Spinner */
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #e0e0e0;
            border-top: 5px solid #3498db; /* Primary color */
            border-radius: 50%;
            margin: 0 auto 1.5rem auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Typography */
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #2c3e50;
        }

        p {
            font-size: 0.95rem;
            color: #7f8c8d;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="waiting-container">
        <!-- Spinner Graphics -->
        <div class="spinner"></div>
        
        <!-- Status Messages -->
        <h1>Please Wait</h1>
        <p>We are processing your request. This will only take a moment. Please do not refresh or close this window.</p>
    </div>

</body>
</html>
